{% extends "base.html" %}
{% block title %}Pixel 管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="fas fa-code me-2"></i>Pixel 管理</h5>
    <button class="btn btn-primary btn-sm" onclick="refreshPixelsFromExtension()">
        <i class="fas fa-sync-alt me-1"></i>刷新Pixel
    </button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-hover data-table mb-0">
            <thead class="table-light">
                <tr>
                    <th>Pixel ID</th>
                    <th>名称</th>
                    <th>所属 BM</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="pixelBody"></tbody>
        </table>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal fade" id="pixelModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="pixelModalTitle">Pixel 详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="pixelModalBody"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/pixel.js"></script>{% endblock %}
