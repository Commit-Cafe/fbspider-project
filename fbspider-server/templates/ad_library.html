{% extends "base.html" %}
{% block title %}素材库{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="fas fa-images me-2"></i>广告素材库</h5>
    <div class="d-flex gap-2">
        <select class="form-select form-select-sm" id="mediaFilter" onchange="loadAdLibrary(1)" style="width:auto">
            <option value="">全部类型</option>
            <option value="IMAGE">图片</option>
            <option value="VIDEO">视频</option>
        </select>
    </div>
</div>

<div class="gallery-grid" id="galleryGrid"></div>

<div class="mt-3 d-flex justify-content-center" id="adLibPagination"></div>
{% endblock %}
{% block scripts %}<script src="/static/js/ad_library.js"></script>{% endblock %}
