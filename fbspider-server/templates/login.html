<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fbhelper 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img src="/static/fbhelper1.png" alt="fbhelper" style="max-width: 220px;">
                        <div class="text-muted small mt-3">请输入账号密码登录管理系统</div>
                    </div>
                    <div class="alert alert-danger d-none" id="loginError"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input class="form-control" id="username" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById("loginError");
    errorEl.classList.add("d-none");
    const resp = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            issue_token: false,
            client_type: "browser"
        })
    });
    const data = await resp.json();
    if (!data.success) {
        errorEl.textContent = data.message || "登录失败";
        errorEl.classList.remove("d-none");
        return;
    }
    window.location.href = "/dashboard";
});
</script>
</body>
</html>
