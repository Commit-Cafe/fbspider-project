<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}fbhelper{% endblock %} - 本地面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar bg-dark text-white">
        <div class="sidebar-header p-3">
            <div class="sidebar-brand">
                <img src="/static/fbhelper1.png" alt="fbhelper logo" class="sidebar-brand-logo">
            </div>
        </div>
        <ul class="nav flex-column px-2">
            <li class="nav-item">
                <a class="nav-link {% if request.path in ['/', '/dashboard'] %}active{% endif %}" href="/dashboard">
                    <i class="fas fa-chart-line me-2"></i>广告账户
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/bm' %}active{% endif %}" href="/bm">
                    <i class="fas fa-building me-2"></i>BM 管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/pixels' %}active{% endif %}" href="/pixels">
                    <i class="fas fa-code me-2"></i>Pixel 管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/ad-library' %}active{% endif %}" href="/ad-library">
                    <i class="fas fa-images me-2"></i>素材库
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">
                    <i class="fas fa-cog me-2"></i>设置
                </a>
            </li>
            {% if auth_user and auth_user.role == 'admin' %}
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/users' %}active{% endif %}" href="/users">
                    <i class="fas fa-user-shield me-2"></i>用户管理
                </a>
            </li>
            {% endif %}
        </ul>
        <div class="sidebar-footer p-3 mt-auto">
            <div id="connection-status" class="small">
                <span class="badge bg-secondary"><i class="fas fa-circle me-1"></i>检测中...</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content flex-grow-1">
        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div class="d-flex align-items-center gap-2 d-none" id="targetUserWrap">
                    <label class="small text-muted mb-0" for="targetUserSelect">数据视图</label>
                    <select class="form-select form-select-sm" id="targetUserSelect" style="width: 220px;"></select>
                </div>
                <div class="d-flex align-items-center gap-2 ms-auto">
                    <span class="small text-muted" id="authUserName"></span>
                    <button class="btn btn-outline-secondary btn-sm" id="logoutBtn">
                        <i class="fas fa-right-from-bracket me-1"></i>退出
                    </button>
                </div>
            </div>
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/common.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
